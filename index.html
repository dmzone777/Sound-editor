<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ece5dd,#d6dbd7);display:flex;flex-direction:column;height:100vh;}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:white;padding:15px;text-align:center;font-weight:bold;position:relative;}
#statusText{font-size:12px;margin-top:2px;opacity:.9}
.toggle-dark{position:absolute;right:15px;top:12px;background:rgba(255,255,255,.2);border:none;padding:6px 10px;border-radius:8px;color:white;cursor:pointer;}
.setup-box{padding:20px;display:flex;flex-direction:column;gap:12px;}
#chatContainer{display:flex;flex-direction:column;flex:1;}
#chat{flex:1;overflow-y:auto;padding:12px;}
.msg{max-width:70%;padding:10px;margin:8px 0;border-radius:14px;background:#fff;}
.me{background:#dcf8c6;margin-left:auto;}
.time{font-size:10px;color:#666}
.message-box{display:flex;padding:10px;background:#fff;gap:6px;}
.message-box input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;}
.dark{background:#0b141a;color:white;}
.dark .msg{background:#1f2c34;}
</style>
</head>

<body>

<header>
Sharko's Web Chat
<div id="statusText"></div>
<button class="toggle-dark" onclick="toggleDark()">🌙</button>
</header>

<div class="setup-box">
<input type="text" id="myName" placeholder="Your name">
<input type="text" id="friendName" placeholder="Friend name">
<button onclick="startChat()">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
<div id="chat"></div>
<div id="typingStatus"></div>

<div class="message-box">
<input type="file" id="imageInput" hidden>
<button onclick="imageInput.click()">➕</button>
<input type="text" id="msg" placeholder="Type message">
<button onclick="send()">➤</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",authDomain:"chat-web-47d00.firebaseapp.com",projectId:"chat-web-47d00"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously();

let roomId="",myName="",friend="";

function setOnline(status){
db.collection("privateChats").doc(roomId).collection("users").doc(myName)
.set({online:status,lastSeen:Date.now()});
}

window.addEventListener("beforeunload",()=>setOnline(false));
document.addEventListener("visibilitychange",()=>{document.hidden?setOnline(false):setOnline(true);});

function startChat(){
myName=myName=document.getElementById("myName").value.trim();
friend=document.getElementById("friendName").value.trim();
if(!myName||!friend)return alert("enter names");

roomId=[myName,friend].sort().join("_");
document.querySelector(".setup-box").style.display="none";
document.getElementById("chatContainer").style.display="flex";

setOnline(true);

db.collection("privateChats").doc(roomId).collection("users").doc(friend)
.onSnapshot(doc=>{
if(doc.exists){
let d=doc.data();
if(d.online)statusText.innerText="online";
else{
let t=new Date(d.lastSeen||Date.now());
statusText.innerText="last seen "+t.getHours()+":"+String(t.getMinutes()).padStart(2,'0');
}
}
});

db.collection("privateChats").doc(roomId).collection("messages").orderBy("time")
.onSnapshot(snapshot=>{
const chat=document.getElementById("chat");
snapshot.docChanges().forEach(change=>{
if(change.type==="added"){
let d=change.doc.data();
let div=document.createElement("div");
div.className="msg"+(d.name===myName?" me":"");
let date=new Date(d.time);
let time=date.getHours()+":"+String(date.getMinutes()).padStart(2,'0');
div.innerHTML=`<b>${d.name}</b><br>${d.text||""}${d.image?`<br><img src="${d.image}">`:""}<div class="time">${time}</div>`;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
});
});
}

function send(){
let text=msg.value.trim();
if(!text)return;
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,text,time:Date.now()});
msg.value="";
}

imageInput.onchange=e=>{
const file=e.target.files[0];
const reader=new FileReader();
reader.onload=ev=>{
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,image:ev.target.result,time:Date.now()});
};
reader.readAsDataURL(file);
};

function toggleDark(){document.body.classList.toggle("dark");}
</script>
</body>
</html>
