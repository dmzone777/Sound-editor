<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>

<style>
body { margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg,#ece5dd,#d6dbd7); display:flex; flex-direction:column; height:100vh; transition:.3s; }
header { background:linear-gradient(135deg,#075e54,#128c7e); color:white; padding:15px; text-align:center; font-size:18px; font-weight:bold; position:relative; box-shadow:0 4px 12px rgba(0,0,0,.2); }
.toggle-dark { position:absolute; right:15px; top:12px; background:rgba(255,255,255,.2); border:none; padding:6px 10px; border-radius:8px; color:white; cursor:pointer; }
.setup-box { padding:20px; display:flex; flex-direction:column; gap:12px; max-width:400px; margin:auto; width:90%; background:#fff; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.input-group { display:flex; flex-direction:column; gap:5px; }
.input-group input { padding:12px; border-radius:10px; border:1px solid #ccc; outline:none; }
.start-btn { padding:12px; background:linear-gradient(135deg,#25d366,#128c7e); border:none; color:white; font-weight:bold; border-radius:10px; cursor:pointer; font-size:16px; }

#chatContainer { display:flex; flex-direction:column; flex:1; position:relative; overflow:hidden; }
#chat { flex:1; overflow-y:auto; padding:12px; scroll-behavior:smooth; }
.msg { max-width:70%; padding:10px 14px; margin:8px 0; border-radius:14px; background:#fff; animation:fade .15s ease; position:relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); user-select:none; }
@keyframes fade { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.me { background:linear-gradient(135deg,#dcf8c6,#b7f3a1); margin-left:auto; }
.time { font-size:10px; color:#666; margin-top:4px; text-align:right; }
.seen-tick { color:#34b7f1; font-weight:bold; }
.typing { font-size:12px; color:#128c7e; font-weight:bold; padding:5px 12px; height:15px; }
.msg-actions { margin-top:6px; display:flex; gap:5px; justify-content:flex-end; }
.delete-btn { background:#ff4d4d; color:white; border:none; padding:4px 8px; font-size:10px; border-radius:6px; cursor:pointer; }
.copy-btn { background:#007bff; color:white; border:none; padding:4px 8px; font-size:10px; border-radius:6px; cursor:pointer; }
.reply-preview { font-size:11px; background:rgba(0,0,0,0.06); border-left:3px solid #128c7e; padding:4px 6px; border-radius:4px; margin-bottom:5px; }

.message-box { display:flex; padding:10px; background:#fff; align-items:center; gap:6px; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
#plusBtn { width:42px; height:42px; border:none; border-radius:50%; background:linear-gradient(135deg,#128c7e,#075e54); color:white; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.message-box input[type="text"] { flex:1; padding:12px; border-radius:20px; border:1px solid #ccc; outline:none; }
.message-box button.sendBtn { width:42px; height:42px; border:none; border-radius:50%; background:linear-gradient(135deg,#25d366,#128c7e); color:white; cursor:pointer; font-size:18px; }
.msg img { max-width:100%; border-radius:10px; margin-top:6px; }

.reply-bar { display:none; background:#f0f0f0; padding:8px 12px; font-size:12px; border-left:4px solid #128c7e; justify-content:space-between; align-items:center; }
.reply-bar button { border:none; background:none; font-weight:bold; cursor:pointer; }

.dark { background:#0b141a; color:white; }
.dark header { background:#000; }
.dark .setup-box { background:#1f2c34; color:white; }
.dark .msg { background:#1f2c34; color:white; }
.dark .me { background:#056162; }
.dark .message-box { background:#1f2c34; }
.dark .reply-preview { background:rgba(255,255,255,0.1); border-left-color:#25d366; }
.dark .reply-bar { background:#1f2c34; color:white; }

#scrollBtn { position:fixed; bottom:80px; right:20px; width:40px; height:40px; border:none; border-radius:50%; background:#25d366; color:white; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.3); z-index:1000; display:none; font-size:18px; }
</style>
</head>

<body>

<header>
  Sharko's Web Chat
  <button class="toggle-dark" onclick="toggleDark()">🌙</button>
</header>

<div class="setup-box">
  <div class="input-group"><label>Your Name</label><input type="text" id="myName"></div>
  <div class="input-group"><label>Friend Name</label><input type="text" id="friendName"></div>
  <button onclick="startChat()" class="start-btn">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
  <div id="chat" onscroll="handleScroll()"></div>
  <div id="typingStatus" class="typing"></div>

  <div id="replyBar" class="reply-bar">
    <span id="replyText">Replying to...</span>
    <button onclick="cancelReply()">✕</button>
  </div>

  <div class="message-box">
    <input type="file" id="imageInput" accept="image/*" hidden>
    <button type="button" id="plusBtn" onclick="document.getElementById('imageInput').click()">➕</button>
    <input type="text" id="msg" placeholder="Type message...">
    <button onclick="send()" class="sendBtn">➤</button>
  </div>
</div>

<button id="scrollBtn" onclick="scrollToBottom()">↓</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",
  authDomain: "chat-web-47d00.firebaseapp.com",
  projectId: "chat-web-47d00",
  storageBucket: "chat-web-47d00.firebasestorage.app",
  messagingSenderId: "888841955234",
  appId: "1:888841955234:web:715d8cad791ae6bce774fb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously();

let roomId = "", myName = "", typingTimer = null, currentReply = null;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound() {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
}

function startChat() {
  myName = document.getElementById("myName").value.trim();
  let friend = document.getElementById("friendName").value.trim();
  if(!myName || !friend) { alert("Enter both names"); return; }

  roomId = [myName, friend].sort().join("_");
  document.querySelector(".setup-box").style.display = "none";
  document.getElementById("chatContainer").style.display = "flex";

  db.collection("privateChats").doc(roomId).collection("messages").orderBy("time")
  .onSnapshot(snapshot => {
    const chat = document.getElementById("chat");
    snapshot.docChanges().forEach(change => {
      if(change.type === "added") {
        let d = change.doc.data();
        let div = document.createElement("div");
        div.className = "msg" + (d.name === myName ? " me" : "");
        div.id = "msg_" + change.doc.id;
        div.ondblclick = () => setupReply(d.name, d.text || "Image");

        let date = new Date(d.time);
        let time = date.getHours().toString().padStart(2, '0') + ":" + date.getMinutes().toString().padStart(2, '0');

        let replyHTML = d.replyTo ? `<div class="reply-preview"><b>${d.replyTo.name}</b>: ${d.replyTo.text}</div>` : '';
        let tickHTML = d.name === myName ? (d.seen ? ' <span class="seen-tick">✓✓</span>' : ' ✓') : '';

        div.innerHTML = `${replyHTML}<b>${d.name}</b><br>${d.text || ""}${d.image ? `<br><img src="${d.image}">` : ""}` +
          `<div class="time">${time}${tickHTML}</div>` +
          `<div class="msg-actions">` +
            (d.name === myName ? `<button class="delete-btn" onclick="deleteMsg('${change.doc.id}')">Delete</button>` : "") +
            `<button class="copy-btn" onclick="copyMsg('${d.text || ''}')">Copy</button>` +
          `</div>`;

        chat.appendChild(div);
        
        if(d.name !== myName) {
          playSound();
          if(!d.seen) change.doc.ref.update({seen: true});
        }
        
        scrollToBottom();
      }
      if(change.type === "modified") {
        let d = change.doc.data();
        let el = document.getElementById("msg_" + change.doc.id);
        if(el && d.name === myName && d.seen) {
          let timeEl = el.querySelector(".time");
          if(timeEl) {
            let date = new Date(d.time);
            let time = date.getHours().toString().padStart(2, '0') + ":" + date.getMinutes().toString().padStart(2, '0');
            timeEl.innerHTML = `${time} <span class="seen-tick">✓✓</span>`;
          }
        }
      }
    });
  });

  db.collection("privateChats").doc(roomId).onSnapshot(doc => {
    if(doc.exists) {
      let data = doc.data();
      document.getElementById("typingStatus").innerText = (data.typing && data.typing !== myName) ? data.typing + " is typing..." : "";
    }
  });
}

function send() {
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if(text === "") return;

  let msgData = { name: myName, text, time: Date.now(), seen: false };
  if(currentReply) {
    msgData.replyTo = currentReply;
    cancelReply();
  }

  db.collection("privateChats").doc(roomId).collection("messages").add(msgData);
  input.value = "";
}

function setupReply(name, text) {
  currentReply = { name, text: text.substring(0, 30) + (text.length > 30 ? "..." : "") };
  document.getElementById("replyText").innerText = `Replying to ${name}: "${currentReply.text}"`;
  document.getElementById("replyBar").style.display = "flex";
}

function cancelReply() {
  currentReply = null;
  document.getElementById("replyBar").style.display = "none";
}

document.getElementById("msg").addEventListener("keydown", e => { if(e.key === "Enter") send(); });

document.getElementById("msg").addEventListener("input", function() {
  clearTimeout(typingTimer);
  db.collection("privateChats").doc(roomId).set({ typing: myName }, { merge: true });
  typingTimer = setTimeout(() => { db.collection("privateChats").doc(roomId).set({ typing: "" }, { merge: true }); }, 1500);
});

document.getElementById("imageInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    let img = new Image();
    img.onload = function() {
      let canvas = document.createElement("canvas");
      let ctx = canvas.getContext("2d");
      canvas.width = img.width * 0.6;
      canvas.height = img.height * 0.6;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      let compressed = canvas.toDataURL("image/jpeg", 0.6);
      db.collection("privateChats").doc(roomId).collection("messages").add({ name: myName, image: compressed, time: Date.now(), seen: false });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function deleteMsg(id) {
  const el = document.getElementById("msg_" + id);
  if(el) el.remove();
  db.collection("privateChats").doc(roomId).collection("messages").doc(id).delete();
}

function copyMsg(text) {
  if(!text) return;
  navigator.clipboard.writeText(text);
}

function toggleDark() { document.body.classList.toggle("dark"); }

function handleScroll() {
  const chat = document.getElementById("chat");
  const scrollBtn = document.getElementById("scrollBtn");
  if (chat.scrollHeight - chat.scrollTop - chat.clientHeight > 150) {
    scrollBtn.style.display = "block";
  } else {
    scrollBtn.style.display = "none";
  }
}

function scrollToBottom() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
