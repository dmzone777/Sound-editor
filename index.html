<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>
<style>
/* (tumhara pura CSS unchanged) */
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ece5dd,#d6dbd7);display:flex;flex-direction:column;height:100vh;transition:.3s;}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:white;padding:15px;text-align:center;font-size:18px;font-weight:bold;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.onlineStatus{position:absolute;left:15px;bottom:4px;font-size:11px;opacity:.9;}
.toggle-dark{position:absolute;right:15px;top:12px;background:rgba(255,255,255,.2);border:none;padding:6px 10px;border-radius:8px;color:white;cursor:pointer;}
.setup-box{padding:20px;display:flex;flex-direction:column;gap:12px;}
.input-group input{padding:12px;border-radius:10px;border:1px solid #ccc;outline:none;}
.start-btn{padding:12px;background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:white;font-weight:bold;border-radius:10px;cursor:pointer;}
#chatContainer{display:flex;flex-direction:column;flex:1;}
#chat{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth;}
.msg{max-width:70%;padding:10px 14px;margin:8px 0;border-radius:14px;background:#fff;animation:fade .15s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.me{background:linear-gradient(135deg,#dcf8c6,#b7f3a1);margin-left:auto;}
.time{font-size:10px;color:#666;margin-top:4px;cursor:pointer;}
.typing{font-size:12px;color:#666;padding:5px 12px;}
.delete-btn{background:#ff4d4d;color:white;border:none;padding:4px 7px;font-size:10px;border-radius:6px;margin-top:5px;cursor:pointer;}
.copy-btn{background:#007bff;color:white;border:none;padding:4px 7px;font-size:10px;border-radius:6px;margin-left:5px;cursor:pointer;}
.message-box{display:flex;padding:10px;background:#fff;align-items:center;gap:6px;}
#plusBtn{width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,#128c7e,#075e54);color:white;font-size:20px;cursor:pointer;}
.message-box input[type="text"]{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;}
.message-box button.sendBtn{width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);color:white;cursor:pointer;}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;cursor:pointer;}
.dark{background:#0b141a;color:white;}
.dark header{background:#000;}
.dark .msg{background:#1f2c34;}
.dark .me{background:#056162;}
.dark .message-box{background:#1f2c34;}
.actions{display:none;margin-top:4px;}
.fullImg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;justify-content:center;align-items:center;z-index:999;}
.fullImg img{max-width:95%;max-height:95%;border-radius:10px;}
.react{font-size:14px;margin-top:4px;cursor:pointer;}
</style>
</head>

<body>

<header>
Sharko's Web Chat
<div id="onlineStatus" class="onlineStatus"></div>
<button class="toggle-dark" onclick="toggleDark()">🌙</button>
</header>

<div class="setup-box">
<div class="input-group"><label>Your Name</label><input type="text" id="myName"></div>
<div class="input-group"><label>Friend Name</label><input type="text" id="friendName"></div>
<button onclick="startChat()" class="start-btn">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
<div id="chat"></div>
<div id="typingStatus" class="typing"></div>
<div class="message-box">
<input type="file" id="imageInput" accept="image/*" hidden>
<button type="button" id="plusBtn" onclick="document.getElementById('imageInput').click()">➕</button>
<input type="text" id="msg" placeholder="Type message...">
<button onclick="send()" class="sendBtn">➤</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",authDomain:"chat-web-47d00.firebaseapp.com",projectId:"chat-web-47d00",storageBucket:"chat-web-47d00.appspot.com",messagingSenderId:"888841955234",appId:"1:888841955234:web:715d8cad791ae6bce774fb"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously();

let roomId="",myName="",typingTimer=null,activityTimer=null,userScrolling=false;
const chatBox=document.getElementById("chat");

window.addEventListener("load",()=>{
const savedRoom=localStorage.getItem("roomId");
const savedMy=localStorage.getItem("myName");
const savedFriend=localStorage.getItem("friendName");
if(savedRoom&&savedMy&&savedFriend){
document.getElementById("myName").value=savedMy;
document.getElementById("friendName").value=savedFriend;
startChat();
}
});

chatBox.addEventListener("scroll",()=>{
const nearBottom=chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<120;
userScrolling=!nearBottom;
});
function smartScroll(){if(!userScrolling){requestAnimationFrame(()=>{chatBox.scrollTo({top:chatBox.scrollHeight,behavior:"smooth"});});}}

function startChat(){
myName=document.getElementById("myName").value.trim();
let friend=document.getElementById("friendName").value.trim();
if(!myName||!friend){alert("Enter both names");return;}
roomId=[myName,friend].sort().join("_");

localStorage.setItem("myName",myName);
localStorage.setItem("friendName",friend);
localStorage.setItem("roomId",roomId);

document.querySelector(".setup-box").style.display="none";
document.getElementById("chatContainer").style.display="flex";

db.collection("privateChats").doc(roomId).collection("messages").orderBy("time").onSnapshot(snapshot=>{
const chat=document.getElementById("chat");
chat.innerHTML="";
snapshot.forEach(doc=>{
let d=doc.data();
let div=document.createElement("div");
div.className="msg"+(d.name===myName?" me":"");
let date=new Date(d.time);
let time=date.getHours()+":"+String(date.getMinutes()).padStart(2,'0');
div.innerHTML=`<b>${d.name}</b><br>${d.text||""}${d.image?`<br><img src="${d.image}" onclick="openImg('${d.image}')">`:""}
<div class="time" onclick="toggleActions(this)">${time}</div>
<div class="actions">${d.name===myName?`<button class="delete-btn" onclick="deleteMsg('${doc.id}')">Delete</button>`:""}
<button class="copy-btn" onclick="copyMsg('${d.text||''}')">Copy</button></div>`;
chat.appendChild(div);
});
smartScroll();
});
}

function send(){let input=document.getElementById("msg");let text=input.value.trim();if(text==="")return;db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,text,time:Date.now()});input.value="";}
document.getElementById("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send();});

function deleteMsg(id){db.collection("privateChats").doc(roomId).collection("messages").doc(id).delete();}
function copyMsg(text){navigator.clipboard.writeText(text);}
function toggleDark(){document.body.classList.toggle("dark");}
function toggleActions(el){document.querySelectorAll(".actions").forEach(a=>a.style.display="none");let act=el.parentElement.querySelector(".actions");act.style.display="block";}
function openImg(src){let div=document.createElement("div");div.className="fullImg";div.innerHTML=`<img src="${src}" onclick="this.parentElement.remove()">`;document.body.appendChild(div);}
</script>
</body>
</html>
