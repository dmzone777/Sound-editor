<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ece5dd,#d6dbd7);display:flex;flex-direction:column;height:100vh;transition:.3s;}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:white;padding:15px;text-align:center;font-size:18px;font-weight:bold;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.toggle-dark{position:absolute;right:15px;top:12px;background:rgba(255,255,255,.2);border:none;padding:6px 10px;border-radius:8px;color:white;cursor:pointer;backdrop-filter:blur(10px);}
.online{font-size:12px;opacity:.8}
.setup-box{padding:20px;display:flex;flex-direction:column;gap:12px;}
.input-group input{padding:12px;border-radius:10px;border:1px solid #ccc;outline:none;transition:.2s;}
.start-btn{padding:12px;background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:white;font-weight:bold;border-radius:10px;cursor:pointer;}
#chatContainer{display:flex;flex-direction:column;flex:1;}
#chat{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth;}
.msg{max-width:70%;padding:10px 14px;margin:8px 0;border-radius:14px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);box-shadow:0 3px 10px rgba(0,0,0,.15);}
.me{background:linear-gradient(135deg,#dcf8c6,#b7f3a1);margin-left:auto;}
.time{font-size:10px;color:#666;margin-top:4px;}
.delete-btn,.copy-btn{color:white;border:none;padding:4px 7px;font-size:10px;border-radius:6px;margin-top:5px;cursor:pointer;}
.delete-btn{background:#ff4d4d;}
.copy-btn{background:#007bff;margin-left:5px;}
.message-box{display:flex;padding:10px;background:rgba(255,255,255,.9);align-items:center;gap:6px;}
#plusBtn{width:42px;height:42px;border:none;border-radius:50%;background:#075e54;color:white;font-size:20px;cursor:pointer;}
.message-box input[type="text"]{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;}
.message-box button.sendBtn{width:42px;height:42px;border:none;border-radius:50%;background:#128c7e;color:white;cursor:pointer;}
.emoji-box{position:absolute;bottom:70px;right:20px;background:white;padding:10px;border-radius:12px;display:none;}
.dark{background:#0b141a;color:white;}
.dark header{background:#000;}
.dark .msg{background:#1f2c34;}
.dark .me{background:#056162;}
.dark .message-box{background:#1f2c34;}
</style>
</head>

<body>

<header>
Sharko's Web Chat
<button class="toggle-dark" onclick="toggleDark()">🌙</button>
<div class="online">offline</div>
</header>

<div class="setup-box">
<div class="input-group"><input type="text" id="myName" placeholder="Your name"></div>
<div class="input-group"><input type="text" id="friendName" placeholder="Friend name"></div>
<button onclick="startChat()" class="start-btn">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
<div id="chat"></div>

<div class="emoji-box" id="emojiBox">
<span onclick="addEmoji('😀')">😀</span>
<span onclick="addEmoji('😂')">😂</span>
<span onclick="addEmoji('🔥')">🔥</span>
<span onclick="addEmoji('❤️')">❤️</span>
</div>

<div class="message-box">
<input type="file" id="imageInput" hidden>
<button id="plusBtn" onclick="plusSound();document.getElementById('imageInput').click()">➕</button>
<button onclick="toggleEmoji()">😊</button>
<input type="text" id="msg" placeholder="Type message...">
<button onclick="send()" class="sendBtn">➤</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({projectId:"chat-web-47d00"});
const db=firebase.firestore();
firebase.auth().signInAnonymously();

let roomId="",myName="";

/* 1 SEC SOUND PLAYER */
function playSound(src){
let s=new Audio(src);
s.play();
setTimeout(()=>{s.pause();s.currentTime=0;},1000);
}

const sendSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");
const deleteSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3");
const copySound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
const editSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/1090/1090-preview.mp3");
const emojiSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3");
const plusSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/1114/1114-preview.mp3");
const darkSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/2103/2103-preview.mp3");
const startSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/1655/1655-preview.mp3");
const msgSound=()=>playSound("https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3");

function startChat(){
startSound();
myName=myName=document.getElementById("myName").value.trim();
let friend=document.getElementById("friendName").value.trim();
if(!myName||!friend)return alert("Enter names");
roomId=[myName,friend].sort().join("_");
document.querySelector(".setup-box").style.display="none";
document.getElementById("chatContainer").style.display="flex";

db.collection("privateChats").doc(roomId).collection("messages").orderBy("time").onSnapshot(s=>{
chat.innerHTML="";
s.forEach(doc=>{
let d=doc.data();
let div=document.createElement("div");
div.className="msg"+(d.name===myName?" me":"");
div.innerHTML=d.text||"";
chat.appendChild(div);
msgSound();
});
});
}

function send(){
sendSound();
let t=msg.value.trim(); if(!t)return;
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,text:t,time:Date.now()});
msg.value="";
}

function deleteMsg(id){deleteSound();}
function copyMsg(text){copySound();navigator.clipboard.writeText(text);}
function editMsg(){editSound();}
function toggleDark(){darkSound();document.body.classList.toggle("dark");}
function toggleEmoji(){emojiSound();emojiBox.style.display=emojiBox.style.display==="block"?"none":"block";}
function addEmoji(e){msg.value+=e;}
</script>
</body>
</html>
