<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>
</head>
<body>

<h2>Private 1-to-1 Chat</h2>

<div>
  Your Name: <input id="myName"><br><br>
  Friend Name: <input id="friendName"><br><br>
  <button onclick="startChat()">Start Chat</button>
</div>

<hr>

<div id="chatBox" style="display:none;">
  <div id="chat"></div>
  <input id="msg" placeholder="Message">
  <button onclick="send()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",
  authDomain: "chat-web-47d00.firebaseapp.com",
  projectId: "chat-web-47d00"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously();

let roomId = "";
let myName = "";

function startChat(){
  myName = document.getElementById("myName").value.trim();
  let friend = document.getElementById("friendName").value.trim();

  if(!myName || !friend) return alert("Enter both names");

  // alphabetical room id
  roomId = [myName, friend].sort().join("_");

  document.getElementById("chatBox").style.display = "block";

  db.collection("privateChats")
    .doc(roomId)
    .collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot=>{
      chat.innerHTML="";
      snapshot.forEach(doc=>{
        let d = doc.data();
        chat.innerHTML += "<p><b>"+d.name+":</b> "+d.text+"</p>";
      });
    });
}

function send(){
  let text = msg.value;
  if(text==="") return;

  db.collection("privateChats")
    .doc(roomId)
    .collection("messages")
    .add({
      name: myName,
      text: text,
      time: Date.now()
    });

  msg.value="";
}
</script>

</body>
</html>
