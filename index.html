<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ece5dd,#d6dbd7);display:flex;flex-direction:column;height:100vh;transition:.3s;}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:white;padding:15px;text-align:center;font-size:18px;font-weight:bold;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.toggle-dark{position:absolute;right:15px;top:12px;background:rgba(255,255,255,.2);border:none;padding:6px 10px;border-radius:8px;color:white;cursor:pointer;}
.setup-box{padding:20px;display:flex;flex-direction:column;gap:12px;}
.input-group input{padding:12px;border-radius:10px;border:1px solid #ccc;outline:none;}
.start-btn{padding:12px;background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:white;font-weight:bold;border-radius:10px;cursor:pointer;}
#chatContainer{display:flex;flex-direction:column;flex:1;}
#chat{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth;}
.msg{max-width:70%;padding:10px 14px;margin:8px 0;border-radius:14px;background:#fff;animation:fade .15s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.me{background:linear-gradient(135deg,#dcf8c6,#b7f3a1);margin-left:auto;}
.time{font-size:10px;color:#666;margin-top:4px;}
.typing{font-size:12px;color:#666;padding:5px 12px;}
.delete-btn{background:#ff4d4d;color:white;border:none;padding:4px 7px;font-size:10px;border-radius:6px;margin-top:5px;cursor:pointer;}
.copy-btn{background:#007bff;color:white;border:none;padding:4px 7px;font-size:10px;border-radius:6px;margin-left:5px;cursor:pointer;}
.message-box{display:flex;padding:10px;background:#fff;align-items:center;gap:6px;}
#plusBtn{width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,#128c7e,#075e54);color:white;font-size:20px;cursor:pointer;}
.message-box input[type="text"]{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;}
.message-box button.sendBtn{width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);color:white;cursor:pointer;}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;}
.dark{background:#0b141a;color:white;}
.dark header{background:#000;}
.dark .msg{background:#1f2c34;}
.dark .me{background:#056162;}
.dark .message-box{background:#1f2c34;}
#scrollBtn{position:fixed;bottom:80px;right:20px;padding:10px 15px;border:none;border-radius:50px;background:#25d366;color:white;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,0.2);}
</style>
</head>

<body>

<header>
Sharko's Web Chat
<button class="toggle-dark" onclick="toggleDark()">🌙</button>
</header>

<div class="setup-box">
<div class="input-group"><label>Your Name</label><input type="text" id="myName"></div>
<div class="input-group"><label>Friend Name</label><input type="text" id="friendName"></div>
<button onclick="startChat()" class="start-btn">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
<div id="chat"></div>
<div id="typingStatus" class="typing"></div>

<div class="message-box">
<input type="file" id="imageInput" accept="image/*" hidden>
<button type="button" id="plusBtn" onclick="document.getElementById('imageInput').click()">➕</button>
<input type="text" id="msg" placeholder="Type message...">
<button onclick="send()" class="sendBtn">➤</button>
</div>
</div>

<!-- Scroll to last message button -->
<button id="scrollBtn" onclick="scrollToLastMessage()">↓ Last</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",authDomain:"chat-web-47d00.firebaseapp.com",projectId:"chat-web-47d00",storageBucket:"chat-web-47d00.firebasestorage.app",messagingSenderId:"888841955234",appId:"1:888841955234:web:715d8cad791ae6bce774fb"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously();

let roomId="",myName="",typingTimer=null;

function startChat(){
myName=document.getElementById("myName").value.trim();
let friend=document.getElementById("friendName").value.trim();
if(!myName||!friend){alert("Enter both names");return;}

roomId=[myName,friend].sort().join("_");
document.querySelector(".setup-box").style.display="none";
document.getElementById("chatContainer").style.display="flex";

db.collection("privateChats").doc(roomId).collection("messages").orderBy("time")
.onSnapshot(snapshot=>{
const chat=document.getElementById("chat");
snapshot.docChanges().forEach(change=>{
if(change.type==="added"){
let d=change.doc.data();
let div=document.createElement("div");
div.className="msg"+(d.name===myName?" me":"");
div.id="msg_"+change.doc.id;

let date=new Date(d.time);
let time=date.getHours()+":"+String(date.getMinutes()).padStart(2,'0');

div.innerHTML=`<b>${d.name}</b><br>${d.text||""}${d.image?`<br><img src="${d.image}">`:""}<div class="time">${time}${d.name===myName?(d.seen?" ✓✓ Seen":" ✓ Sent"):""}</div>${d.name===myName?`<button class="delete-btn" onclick="deleteMsg('${change.doc.id}')">Delete</button>`:""}<button class="copy-btn" onclick="copyMsg('${d.text||''}')">Copy</button>`;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight; // Auto scroll for new messages
if(d.name!==myName&&!d.seen)change.doc.ref.update({seen:true});
}
});
});

db.collection("privateChats").doc(roomId).onSnapshot(doc=>{
if(doc.exists){
let data=doc.data();
document.getElementById("typingStatus").innerText=(data.typing&&data.typing!==myName)?data.typing+" is typing...":"";
}
});
}

function send(){
let input=document.getElementById("msg");
let text=input.value.trim();
if(text==="")return;
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,text,time:Date.now(),seen:false});
input.value="";
}

document.getElementById("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send();});

document.getElementById("msg").addEventListener("input",function(){
clearTimeout(typingTimer);
db.collection("privateChats").doc(roomId).set({typing:myName},{merge:true});
typingTimer=setTimeout(()=>{db.collection("privateChats").doc(roomId).set({typing:""},{merge:true});},1500);
});

document.getElementById("imageInput").addEventListener("change",function(e){
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(ev){
let img=new Image();
img.onload=function(){
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");
canvas.width=img.width*0.6;
canvas.height=img.height*0.6;
ctx.drawImage(img,0,0,canvas.width,canvas.height);
let compressed=canvas.toDataURL("image/jpeg",0.6);
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,image:compressed,time:Date.now(),seen:false});
};
img.src=ev.target.result;
};
reader.readAsDataURL(file);
});

function deleteMsg(id){
const el=document.getElementById("msg_"+id);
if(el) el.remove();
db.collection("privateChats").doc(roomId).collection("messages").doc(id).delete();
}

function copyMsg(text){
if(!text) return;
navigator.clipboard.writeText(text);
alert("Copied ✅");
}

function toggleDark(){document.body.classList.toggle("dark");}

// Scroll to last message function
function scrollToLastMessage(){
    const chat=document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
