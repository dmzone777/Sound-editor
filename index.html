<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#ece5dd;
  display:flex;
  flex-direction:column;
  height:100vh;
}
header{
  background:#075e54;
  color:white;
  padding:15px;
  text-align:center;
  font-weight:bold;
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}
.msg{
  max-width:70%;
  padding:8px 12px;
  margin:6px 0;
  border-radius:8px;
  background:white;
}
.me{
  background:#dcf8c6;
  margin-left:auto;
}
#inputArea{
  display:flex;
  padding:10px;
  background:white;
}
#msg{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  outline:none;
}
button{
  margin-left:10px;
  padding:10px 15px;
  border:none;
  border-radius:50%;
  background:#25d366;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<header>My Chat</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="msg" placeholder="Type a message..." />
  <button onclick="sendMsg()">➤</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",
  authDomain: "chat-web-47d00.firebaseapp.com",
  projectId: "chat-web-47d00",
  storageBucket: "chat-web-47d00.firebasestorage.app",
  messagingSenderId: "888841955234",
  appId: "1:888841955234:web:715d8cad791ae6bce774fb",
  measurementId: "G-L4ZHQ3DMZT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let username = prompt("Enter your nickname:");
signInAnonymously(auth);

window.sendMsg = async function() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(text === "") return;

  await addDoc(collection(db, "messages"), {
    name: username,
    text: text,
    time: Date.now()
  });

  input.value = "";
};

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();
    const div = document.createElement("div");
    div.className = "msg" + (data.name === username ? " me" : "");
    div.innerHTML = `<b>${data.name}</b><br>${data.text}`;
    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

</script>

</body>
</html>
