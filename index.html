<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharko Private Chat</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#ece5dd;height:100vh;display:flex;flex-direction:column;}
header{background:#075e54;color:white;padding:15px;text-align:center;font-weight:bold;position:relative;}
.toggle-dark{position:absolute;right:15px;top:12px;border:none;padding:5px 10px;border-radius:6px;}
#chatList{background:white;max-height:150px;overflow:auto;}
.friendItem{padding:10px;border-bottom:1px solid #ddd;cursor:pointer;}
.setup-box{padding:15px;display:flex;flex-direction:column;gap:10px;}
input{padding:10px;border-radius:8px;border:1px solid #ccc;}
.start-btn{padding:10px;background:#25d366;border:none;color:white;border-radius:8px;}
#chatContainer{display:flex;flex-direction:column;flex:1;}
#chat{flex:1;overflow:auto;padding:10px;}
.msg{max-width:70%;padding:8px;margin:6px 0;border-radius:10px;background:white;}
.me{background:#dcf8c6;margin-left:auto;}
.message-box{display:flex;padding:10px;background:white;gap:5px;}
.message-box input{flex:1;}
</style>
</head>

<body>

<header>
Sharko Chat
<button class="toggle-dark" onclick="toggleDark()">🌙</button>
</header>

<div id="chatList"></div>

<div class="setup-box">
<input id="myName" placeholder="Your Name">
<input id="friendName" placeholder="Friend Name">
<button onclick="startChat()" class="start-btn">Start Chat</button>
</div>

<div id="chatContainer" style="display:none;">
<div id="chat"></div>
<div class="message-box">
<input type="file" id="imageInput" hidden>
<button onclick="document.getElementById('imageInput').click()">➕</button>
<input id="msg" placeholder="Type message">
<button onclick="send()">➤</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyA",authDomain:"chat-web-47d00.firebaseapp.com",projectId:"chat-web-47d00"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously();

let roomId="",myName="";

window.onload=function(){
renderChatList();
let savedMy=localStorage.getItem("myName");
let savedFriend=localStorage.getItem("friendName");
if(savedMy&&savedFriend){initChat(savedMy,savedFriend);}
}

function startChat(){
myName=document.getElementById("myName").value.trim();
let friend=document.getElementById("friendName").value.trim();
if(!myName||!friend)return;

localStorage.setItem("myName",myName);
localStorage.setItem("friendName",friend);

let list=JSON.parse(localStorage.getItem("chatFriends")||"[]");
if(!list.includes(friend)){list.push(friend);localStorage.setItem("chatFriends",JSON.stringify(list));}
renderChatList();

initChat(myName,friend);
}

function renderChatList(){
let list=JSON.parse(localStorage.getItem("chatFriends")||"[]");
let box=document.getElementById("chatList");
box.innerHTML="";
list.forEach(f=>{
let div=document.createElement("div");
div.className="friendItem";
div.innerText=f;
div.onclick=()=>initChat(localStorage.getItem("myName"),f);
box.appendChild(div);
});
}

function initChat(my,friend){
myName=my;
roomId=[my,friend].sort().join("_");
document.querySelector(".setup-box").style.display="none";
document.getElementById("chatContainer").style.display="flex";

db.collection("privateChats").doc(roomId).collection("messages").orderBy("time").onSnapshot(snapshot=>{
const chat=document.getElementById("chat");chat.innerHTML="";
snapshot.forEach(doc=>{
let d=doc.data();
let div=document.createElement("div");
div.className="msg"+(d.name===myName?" me":"");
div.innerHTML=d.text||"";
chat.appendChild(div);
});
});
}

function send(){
let text=document.getElementById("msg").value.trim();
if(!text)return;
db.collection("privateChats").doc(roomId).collection("messages").add({name:myName,text:text,time:Date.now()});
document.getElementById("msg").value="";
}

function toggleDark(){document.body.classList.toggle("dark");}
</script>
</body>
</html>
