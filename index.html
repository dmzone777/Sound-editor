<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#ece5dd;
  display:flex;
  flex-direction:column;
  height:100vh;
}

header{
  background:#075e54;
  color:white;
  padding:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.setup-box{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.input-group{
  display:flex;
  flex-direction:column;
}

input{
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
  outline:none;
}

.start-btn{
  padding:10px;
  background:#25d366;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:6px;
}

#chatContainer{
  display:flex;
  flex-direction:column;
  flex:1;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  max-width:70%;
  padding:8px 12px;
  margin:6px 0;
  border-radius:8px;
  background:white;
  position:relative;
}

.me{
  background:#dcf8c6;
  margin-left:auto;
}

.delete-btn{
  background:red;
  color:white;
  border:none;
  padding:3px 6px;
  font-size:10px;
  border-radius:4px;
  margin-top:5px;
}

.message-box{
  display:flex;
  padding:10px;
  background:white;
}

.message-box input{
  flex:1;
}

.message-box button{
  margin-left:10px;
  padding:10px;
  border:none;
  border-radius:50%;
  background:#25d366;
  color:white;
}
</style>
</head>

<body>

<header>Private 1-to-1 Chat</header>

<div class="setup-box">
  <div class="input-group">
    <label>Your Name</label>
    <input type="text" id="myName" placeholder="Enter your name">
  </div>

  <div class="input-group">
    <label>Friend Name</label>
    <input type="text" id="friendName" placeholder="Enter friend name">
  </div>

  <button onclick="startChat()" class="start-btn">
    Start Chat
  </button>
</div>

<div id="chatContainer" style="display:none;">
  <div id="chat"></div>

  <div class="message-box">
    <input type="text" id="msg" placeholder="Type a message...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA_kkzpXhU8BOmUsSjij1Uu1blA3AtGHtY",
  authDomain: "chat-web-47d00.firebaseapp.com",
  projectId: "chat-web-47d00"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously();

let roomId = "";
let myName = "";

function startChat(){
  myName = document.getElementById("myName").value.trim();
  let friend = document.getElementById("friendName").value.trim();

  if(!myName || !friend){
    alert("Enter both names");
    return;
  }

  roomId = [myName, friend].sort().join("_");

  document.querySelector(".setup-box").style.display="none";
  document.getElementById("chatContainer").style.display="flex";

  db.collection("privateChats")
    .doc(roomId)
    .collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot=>{
      const chat = document.getElementById("chat");
      chat.innerHTML="";

      snapshot.forEach(doc=>{
        let d = doc.data();
        let div = document.createElement("div");
        div.className="msg"+(d.name===myName?" me":"");

        div.innerHTML = `
          <b>${d.name}</b><br>
          ${d.text}
          ${d.name===myName ? 
            `<br><button class="delete-btn" onclick="deleteMsg('${doc.id}')">Delete</button>` 
            : "" }
        `;

        chat.appendChild(div);
      });

      chat.scrollTop=chat.scrollHeight;
    });
}

function send(){
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if(text==="") return;

  db.collection("privateChats")
    .doc(roomId)
    .collection("messages")
    .add({
      name: myName,
      text: text,
      time: Date.now()
    });

  input.value="";
}

/* Enter key send */
document.getElementById("msg").addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    send();
  }
});

function deleteMsg(id){
  db.collection("privateChats")
    .doc(roomId)
    .collection("messages")
    .doc(id)
    .delete();
}
</script>

</body>
</html>
